# Netlify: liga o repositório e carrega em Deploy; não é preciso configurar mais nada.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# O service worker tem de ser sempre revalidado para as atualizações chegarem aos jogadores.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
