<!doctype html>
<html lang="pt-PT"><head><meta charset="UTF-8"><title>Hex tiles</title>
<style>body{margin:0;background:#111}canvas{display:block;width:100vw;height:100vh}.l{position:fixed;color:#fff;font:12px monospace;transform:translate(-50%,0);text-shadow:0 0 3px #000}</style></head>
<body><canvas></canvas><script type="module">
// Dev-only: every road/river/coast tile from above, with +X marked, to read which hex edges each tile connects.
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const canvas=document.querySelector('canvas'),r=new T.WebGLRenderer({canvas,antialias:true});r.setSize(innerWidth,innerHeight,false);r.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene();scene.add(new T.AmbientLight(0xffffff,2.5));
const l=new GLTFLoader();l.setMeshoptDecoder(MeshoptDecoder);const g=await l.loadAsync('/models/env/hex.glb');
const filter=new URLSearchParams(location.search).get('f')||'hex_road|hex_river|hex_coast';const re=new RegExp(filter);
const items=g.scene.children.filter(c=>re.test(c.name));const cols=8;
const cam=new T.OrthographicCamera(-1.5,cols*3-1.5,1.6,-Math.ceil(items.length/cols)*3.2+1.6,.1,50);const iso=new URLSearchParams(location.search).has('iso');if(iso){cam.position.set(0,20,20*Math.cos(.96)/Math.sin(.96));cam.lookAt(0,0,0);}else{cam.position.set(0,20,0);cam.up.set(0,0,-1);cam.lookAt(0,0,0);}
items.forEach((c,i)=>{const o=c.clone();o.position.set(i%cols*3,0,Math.floor(i/cols)*3.2);scene.add(o);const m=new T.Mesh(new T.SphereGeometry(.12),new T.MeshBasicMaterial({color:0xff0000}));m.position.set(o.position.x+1.1,.3,o.position.z);scene.add(m);});
cam.left=-1.5;cam.right=cols*3-1.5;cam.top=1.6;cam.bottom=-(Math.ceil(items.length/cols)*3.2-1.6);
// keep aspect
const w=cam.right-cam.left,h=cam.top-cam.bottom,a=innerWidth/innerHeight;if(w/h>a){const nh=w/a;cam.bottom=cam.top-nh;}else{cam.right=cam.left+h*a;}
cam.updateProjectionMatrix();r.render(scene,cam);
const v=new T.Vector3();items.forEach((c,i)=>{v.set(i%cols*3,0,Math.floor(i/cols)*3.2+1.35).project(cam);const d=document.createElement('div');d.className='l';d.textContent=c.name.replace('hex_','');d.style.left=(v.x+1)/2*innerWidth+'px';d.style.top=(1-v.y)/2*innerHeight+'px';document.body.append(d);});
document.body.dataset.ready='1';
</script></body></html>
